plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // TFC dependency (compiled jar in libs/)
    implementation files("libs/TerraFirmaCraft-1.21.1.jar")
    // ES dependency (compiled jar in libs/)
    implementation files("libs/EclipticSeasons-1.21.1-neoforge-0.13.9.1.jar")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// === 生成 TFC 覆雪定义 JSON（无需 Minecraft 环境） ===
tasks.register('generateTfcSnowDefinitions') {
    group = 'estfc'
    description = 'Generate snow_definitions JSON for TFC blocks'

    // 配置时捕获，避免执行时访问 project（configuration cache 兼容）
    def projectDir = project.layout.projectDirectory.asFile
    def outputDir = new File(projectDir, 'src/generated/resources/data/estfc/eclipticseasons/snow_definitions')
    def manifestFile = new File(projectDir, 'src/generated/resources/plant_manifest.json')
    def modelDefDir = new File(projectDir, 'src/generated/resources/assets/estfc/eclipticseasons/model_definitions/snowy')
    def blockModelDir = new File(projectDir, 'src/generated/resources/assets/estfc/models/block/snowy/tfc')
    def tfcModelDir = new File(projectDir, '../TerraFirmaCraft-1.21.x/src/main/resources/assets/tfc/models/block')

    doLast {
        outputDir.mkdirs()

        // 第一批：地面装饰物
        def groundcoverTypes = [
            'bone', 'clam', 'driftwood', 'feather', 'flint', 'guano', 'humus',
            'mollusk', 'mussel', 'pinecone', 'pumice', 'rotten_flesh',
            'salt_lick', 'seaweed', 'sea_urchin', 'stick'
        ]
        groundcoverTypes.each { type ->
            def f = new File(outputDir, "tfc_groundcover_${type}.json")
            f.text = "{\n  \"blocks\": [\"tfc:groundcover/${type}\"],\n  \"flag\": 1000,\n  \"offset\": 1,\n  \"mid\": \"estfc:snowy_groundcover\"\n}"
        }

        // 散落岩石
        def rockTypes = [
            'granite', 'diorite', 'gabbro', 'shale', 'claystone', 'limestone',
            'conglomerate', 'dolomite', 'chert', 'chalk', 'tuff', 'rhyolite',
            'basalt', 'andesite', 'dacite', 'quartzite', 'slate', 'phyllite',
            'schist', 'gneiss', 'marble'
        ]
        rockTypes.each { rock ->
            def f1 = new File(outputDir, "tfc_loose_rock_${rock}.json")
            f1.text = "{\n  \"blocks\": [\"tfc:rock/loose/${rock}\"],\n  \"flag\": 1000,\n  \"offset\": 1,\n  \"mid\": \"estfc:snowy_groundcover\"\n}"
            def f2 = new File(outputDir, "tfc_mossy_loose_rock_${rock}.json")
            f2.text = "{\n  \"blocks\": [\"tfc:rock/mossy_loose/${rock}\"],\n  \"flag\": 1000,\n  \"offset\": 1,\n  \"mid\": \"estfc:snowy_groundcover\"\n}"
        }

        // 第二批：树叶 — 双层雪模 (flag 1101: 顶层+内部斑点)
        def woodTypes = [
            'acacia', 'ash', 'aspen', 'birch', 'blackwood', 'chestnut',
            'douglas_fir', 'hickory', 'kapok', 'mangrove', 'maple', 'oak',
            'palm', 'pine', 'rosewood', 'sequoia', 'spruce', 'sycamore',
            'white_cedar', 'willow'
        ]
        woodTypes.each { wood ->
            def f = new File(outputDir, "tfc_leaves_${wood}.json")
            f.text = "{\n  \"blocks\": [\"tfc:wood/leaves/${wood}\"],\n  \"flag\": 1101,\n  \"offset\": 0,\n  \"mid\": \"eclipticseasons:snowy_leaves_top\",\n  \"mid2\": \"eclipticseasons:snowy_leaves_attach\"\n}"
            def ff = new File(outputDir, "tfc_fallen_leaves_${wood}.json")
            ff.text = "{\n  \"blocks\": [\"tfc:wood/fallen_leaves/${wood}\"],\n  \"flag\": 1000,\n  \"offset\": 0,\n  \"mid\": \"estfc:snowy_groundcover\"\n}"
        }

        // ── 植物/农作物 (replace:true, 模仿 TFC 原始模型结构) ──
        // 方块 ID 来自 TFC Crop/Plant 枚举; manifest 用于查找最佳贴图

        def tfcCrops = [
            'alfalfa', 'barley', 'beet', 'cabbage', 'canola', 'carrot', 'cassava',
            'garlic', 'green_bean', 'jute', 'lentil', 'maize', 'melon', 'oat',
            'onion', 'papyrus', 'peanut', 'potato', 'pumpkin', 'radish',
            'red_bell_pepper', 'rice', 'rye', 'soybean', 'squash', 'sugarcane',
            'tomato', 'wheat', 'yellow_bell_pepper'
        ] as Set

        def blockIdFix = [
            'pumpkin_side':       [id: 'tfc:pumpkin',        name: 'pumpkin_fruit'],
            'melon_side':         [id: 'tfc:melon',          name: 'melon_fruit'],
            'rotten_pumpkin_side':[id: 'tfc:rotten_pumpkin', name: 'rotten_pumpkin'],
            'rotten_pumpkin_top': [id: 'tfc:rotten_pumpkin', name: 'rotten_pumpkin'],
            'rotten_melon_side':  [id: 'tfc:rotten_melon',   name: 'rotten_melon'],
            'rotten_melon_top':   [id: 'tfc:rotten_melon',   name: 'rotten_melon'],
        ]
        def skipKeys = ['stick_top', 'wild_crop_grass', 'rattan'] as Set

        def texToTfcBlocks = [
            'tulip':      ['tulip_orange','tulip_pink','tulip_red','tulip_white'],
            'water_lily': ['white_water_lily','purple_water_lily','yellow_water_lily'],
            'snapdragon': ['snapdragon_pink','snapdragon_red','snapdragon_white','snapdragon_yellow'],
            'hanging_vines':   ['hanging_vines_plant','hanging_vines'],
            'spanish_moss':    ['spanish_moss_plant','spanish_moss'],
            'liana':           ['liana_plant','liana'],
            'flame_vine':      ['flame_vine_plant','flame_vine'],
            'tree_fern':       ['tree_fern_plant','tree_fern'],
            'cycad':           ['cycad_plant','cycad'],
            'arundo':          ['arundo_plant','arundo'],
            'dry_phragmite':   ['dry_phragmite_plant','dry_phragmite'],
            'winged_kelp':     ['winged_kelp_plant','winged_kelp'],
            'leafy_kelp':      ['leafy_kelp_plant','leafy_kelp'],
            'giant_kelp':      ['giant_kelp_plant','giant_kelp_flower'],
            'golden_bamboo':   ['golden_bamboo','golden_bamboo_sapling'],
            'saguaro':         ['saguaro_plant','saguaro'],
        ]

        // 清理旧文件
        if (modelDefDir.exists()) modelDefDir.deleteDir()
        if (blockModelDir.exists()) blockModelDir.deleteDir()
        outputDir.eachFile { f -> if (f.name.startsWith('tfc_plant_')) f.delete() }
        modelDefDir.mkdirs()
        blockModelDir.mkdirs()

        if (!manifestFile.exists()) {
            println "WARNING: plant_manifest.json not found. Run gen_snowy.py first."
            return
        }

        def manifest = new groovy.json.JsonSlurper().parse(manifestFile)

        // 第一步：从 manifest 提取贴图信息 (plant_key -> best_texture)
        def texLookup = [:]  // plant_key -> best_texture
        manifest.each { p ->
            def key = p.plant_key
            if (!texLookup.containsKey(key) && !skipKeys.contains(key))
                texLookup[key] = p.best_texture
        }

        // 第二步：构建 TFC 方块 → [blockId, best_texture] 映射
        def blockInfoMap = [:]  // tfcName -> [blockId, best]

        tfcCrops.each { name ->
            if (texLookup.containsKey(name))
                blockInfoMap[name] = [id: "tfc:crop/${name}", best: texLookup[name]]
        }
        blockIdFix.each { manifestKey, fix ->
            if (texLookup.containsKey(manifestKey) && !blockInfoMap.containsKey(fix.name))
                blockInfoMap[fix.name] = [id: fix.id, best: texLookup[manifestKey]]
        }
        texToTfcBlocks.each { texKey, tfcNames ->
            if (texLookup.containsKey(texKey)) {
                tfcNames.each { name ->
                    if (!blockInfoMap.containsKey(name))
                        blockInfoMap[name] = [id: "tfc:plant/${name}", best: texLookup[texKey]]
                }
            }
        }
        texLookup.each { key, best ->
            def cropVariant = tfcCrops.find { key.startsWith(it) && (key.length() == it.length() || key.charAt(it.length()) == '_') }
            if (cropVariant) return
            if (blockIdFix.containsKey(key)) return
            if (!texToTfcBlocks.containsKey(key) && !blockInfoMap.containsKey(key))
                blockInfoMap[key] = [id: "tfc:plant/${key}", best: best]
        }

        // 第三步：扫描 TFC 模型，建立 贴图路径 → TFC模型内容 的映射
        def tfcModelByTexture = [:]  // "crop/barley_7" → model JSON string
        def slurper = new groovy.json.JsonSlurper()
        ['crop', 'plant'].each { subDir ->
            def dir = new File(tfcModelDir, subDir)
            if (dir.exists()) {
                dir.eachFileRecurse { f ->
                    if (f.name.endsWith('.json')) {
                        try {
                            def model = slurper.parse(f)
                            def textures = model?.textures
                            if (textures instanceof Map) {
                                textures.values().each { v ->
                                    if (v instanceof String && v.startsWith('tfc:block/')) {
                                        def key = v.substring('tfc:block/'.length())
                                        if (!tfcModelByTexture.containsKey(key))
                                            tfcModelByTexture[key] = f.text
                                    }
                                }
                            }
                        } catch (Exception ignored) {}
                    }
                }
            }
        }
        println "Indexed ${tfcModelByTexture.size()} TFC models"

        // 第四步：生成 JSON — 复制 TFC 模型，贴图替换为覆雪版
        int count = 0
        int tfcHits = 0
        blockInfoMap.each { tfcName, info ->
            // 雪定义
            def sd = new File(outputDir, "tfc_plant_${tfcName}.json")
            sd.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                blocks: info.id,
                flag: 1001,
                offset: 1,
                mid: "estfc:snowy/tfc_${tfcName}"
            ]))

            // 模型定义
            def md = new File(modelDefDir, "tfc_${tfcName}.json")
            md.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                replace: true,
                variants: ["" : [model: "estfc:block/snowy/tfc/${info.best}"]]
            ]))

            // 方块模型 — 优先复制 TFC 原版模型，替换贴图路径
            def bmFile = new File(blockModelDir, info.best + '.json')
            bmFile.toPath().toAbsolutePath().getParent().toFile().mkdirs()
            // 尝试多种 key 来匹配 (manifest best_texture 前缀可能和 TFC 纹理路径不同)
            def tfcModel = tfcModelByTexture[info.best]
                ?: tfcModelByTexture["plant/${info.best}"]
                ?: tfcModelByTexture["crop/${info.best}"]
            if (tfcModel != null) {
                // 复制 TFC 模型，替换所有 tfc: 贴图引用 → estfc:
                bmFile.text = tfcModel.replaceAll('"tfc:', '"estfc:')
                tfcHits++
            } else {
                // 回退：生成简单 cross/crop 模型
                def isCrop = info.best.startsWith('crop/')
                bmFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    parent: isCrop ? 'block/crop' : 'block/cross',
                    textures: [(isCrop ? 'crop' : 'cross'): "estfc:block/${info.best}"]
                ]))
            }
            count++
        }
        println "Generated ${count} plants (${tfcHits} from TFC models, ${count - tfcHits} fallback)"
    }
}

// 处理资源时先生成 JSON
processResources.dependsOn generateTfcSnowDefinitions

// === 验证：对比生成的雪定义中引用的方块 ID 是否都在 TFC 中存在 ===
tasks.register('verifySnowBlockIds') {
    group = 'estfc'
    description = 'Compare snow_definition block IDs against TFC source registration'
    doLast {
        def tfcDir = new File(project.layout.projectDirectory.asFile, '../TerraFirmaCraft-1.21.x/src/main/java/net/dries007/tfc/common/blocks')
        def tfcBlocksFile = new File(tfcDir, 'TFCBlocks.java')
        def cropFile = new File(tfcDir, 'crop/Crop.java')
        def plantFile = new File(tfcDir, 'plant/Plant.java')
        def snowDefDir = new File(project.layout.projectDirectory.asFile, 'src/generated/resources/data/estfc/eclipticseasons/snow_definitions')

        if (!tfcBlocksFile.exists()) {
            println "ERROR: TFCBlocks.java not found at ${tfcBlocksFile}"
            return
        }

        // Extract enum names
        def extractEnum = { file ->
            def names = []
            file.text.eachLine { line ->
                def m = (line =~ /^\s*([A-Z][A-Z_0-9]+)\s*\(/)
                if (m.find() && m.group(1).length() > 1) names << m.group(1)
            }
            return names
        }
        def cropNames = extractEnum(cropFile)
        def plantNames = extractEnum(plantFile)
        println "Crops: ${cropNames.size()}, Plants: ${plantNames.size()}"

        // Parse TFCBlocks.java for all register("path",...) calls
        def text = tfcBlocksFile.text
        def directPaths = []
        (text =~ /register(?:NoItem)?\("([^"]+)"\s*,/).each { match ->
            directPaths << "tfc:${match[1]}"
        }
        println "Direct registrations (incl. map-based): ${directPaths.size()}"

        // Also extract map-based registrations from Helpers.mapOf patterns
        // Pattern: Helpers.mapOf(SomeEnum.class, v -> register("prefix/" + v.name() ...
        // These already show up as directPaths if the register call is on the same line
        def rpMapOf = (text =~ /Helpers\.mapOf\(\w+\.class,\s*\w+\s*->\s*register(?:NoItem)?\("([^"]+)"\s*\+/).each { match ->
            // These register calls use string concatenation like "prefix/" + v.name()
            // The prefix is captured; we'd need the enum to expand. Skip for now.
        }
        // Also find patterns like: register("crop/" + crop.name(), ...
        // But these are already covered by our manual enum expansion below

        // Build full TFC block set
        def tfcBlocks = [] as Set
        tfcBlocks.addAll(directPaths)
        cropNames.each { n -> tfcBlocks << "tfc:crop/${n.toLowerCase()}"; tfcBlocks << "tfc:dead_crop/${n.toLowerCase()}"; tfcBlocks << "tfc:wild_crop/${n.toLowerCase()}" }
        plantNames.each { n -> tfcBlocks << "tfc:plant/${n.toLowerCase()}" }

        // Also extract GroundcoverBlockType enum and Wood enum if needed
        def groundcoverFile = new File(tfcDir, 'GroundcoverBlockType.java')
        def woodFile = new File(project.layout.projectDirectory.asFile, '../TerraFirmaCraft-1.21.x/src/main/java/net/dries007/tfc/common/blocks/wood/Wood.java')
        if (groundcoverFile.exists()) {
            def gcNames = extractEnum(groundcoverFile)
            gcNames.each { n -> tfcBlocks << "tfc:groundcover/${n.toLowerCase()}" }
        }
        // Rock types (21 types, hardcoded)
        def rockTypes = ['granite','diorite','gabbro','shale','claystone','limestone','conglomerate','dolomite','chert','chalk','tuff','rhyolite','basalt','andesite','dacite','quartzite','slate','phyllite','schist','gneiss','marble']
        rockTypes.each { r -> tfcBlocks << "tfc:rock/loose/${r}"; tfcBlocks << "tfc:rock/mossy_loose/${r}" }
        // Wood types (from build.gradle)
        def woodTypes = ['acacia','ash','aspen','birch','blackwood','chestnut','douglas_fir','hickory','kapok','mangrove','maple','oak','palm','pine','rosewood','sequoia','spruce','sycamore','white_cedar','willow']
        woodTypes.each { w -> tfcBlocks << "tfc:wood/leaves/${w}"; tfcBlocks << "tfc:wood/fallen_leaves/${w}" }

        println "Total TFC blocks: ${tfcBlocks.size()}"

        // Read all snow definitions
        def snowRefs = [] as Set
        if (snowDefDir.exists()) {
            snowDefDir.eachFile { f ->
                if (f.name.endsWith('.json')) {
                    try {
                        def data = new groovy.json.JsonSlurper().parse(f)
                        def bv = data.blocks
                        if (bv instanceof String) snowRefs << bv
                        else if (bv instanceof List) snowRefs.addAll(bv)
                    } catch (Exception e) { println "Error: ${f.name}: ${e.message}" }
                }
            }
        }
        println "Snow def unique blocks: ${snowRefs.size()}"

        // Compare
        def invalid = snowRefs - tfcBlocks
        if (invalid) {
            println "\n=== INVALID block IDs (${invalid.size()}) ==="
            invalid.sort().each { println "  ${it}" }
        } else {
            println "\n=== ALL VALID! No invalid block IDs found. ==="
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
