plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // TFC dependency (compiled jar in libs/)
    implementation files("libs/TerraFirmaCraft-1.21.1.jar")
    // ES dependency (compiled jar in libs/)
    implementation files("libs/EclipticSeasons-1.21.1-neoforge-0.13.9.1.jar")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// === 生成 TFC 覆雪定义 JSON（无需 Minecraft 环境） ===
tasks.register('generateTfcSnowDefinitions') {
    group = 'estfc'
    description = 'Generate snow_definitions JSON for TFC blocks'

    // 配置时捕获，避免执行时访问 project（configuration cache 兼容）
    def projectDir = project.layout.projectDirectory.asFile
    def outputDir = new File(projectDir, 'src/generated/resources/data/estfc/eclipticseasons/snow_definitions')
    def manifestFile = new File(projectDir, 'src/generated/resources/plant_manifest.json')
    def modelDefDir = new File(projectDir, 'src/generated/resources/assets/estfc/eclipticseasons/model_definitions/snowy')
    def blockModelDir = new File(projectDir, 'src/main/resources/assets/estfc/models/block/snowy/tfc')

    doLast {
        outputDir.mkdirs()

        // 第一批：地面装饰物
        def groundcoverTypes = [
            'bone', 'clam', 'driftwood', 'feather', 'flint', 'guano', 'humus',
            'mollusk', 'mussel', 'pinecone', 'pumice', 'rotten_flesh',
            'salt_lick', 'seaweed', 'sea_urchin', 'stick'
        ]
        groundcoverTypes.each { type ->
            def f = new File(outputDir, "tfc_groundcover_${type}.json")
            f.text = "{\n  \"blocks\": [\"tfc:groundcover/${type}\"],\n  \"flag\": 1000,\n  \"offset\": 1,\n  \"mid\": \"estfc:snowy_groundcover\"\n}"
        }

        // 散落岩石
        def rockTypes = [
            'granite', 'diorite', 'gabbro', 'shale', 'claystone', 'limestone',
            'conglomerate', 'dolomite', 'chert', 'chalk', 'tuff', 'rhyolite',
            'basalt', 'andesite', 'dacite', 'quartzite', 'slate', 'phyllite',
            'schist', 'gneiss', 'marble'
        ]
        rockTypes.each { rock ->
            def f1 = new File(outputDir, "tfc_loose_rock_${rock}.json")
            f1.text = "{\n  \"blocks\": [\"tfc:rock/loose/${rock}\"],\n  \"flag\": 1000,\n  \"offset\": 1,\n  \"mid\": \"estfc:snowy_groundcover\"\n}"
            def f2 = new File(outputDir, "tfc_mossy_loose_rock_${rock}.json")
            f2.text = "{\n  \"blocks\": [\"tfc:rock/mossy_loose/${rock}\"],\n  \"flag\": 1000,\n  \"offset\": 1,\n  \"mid\": \"estfc:snowy_groundcover\"\n}"
        }

        // 第二批：树叶 — 双层雪模 (flag 1101: 顶层+内部斑点)
        def woodTypes = [
            'acacia', 'ash', 'aspen', 'birch', 'blackwood', 'chestnut',
            'douglas_fir', 'hickory', 'kapok', 'mangrove', 'maple', 'oak',
            'palm', 'pine', 'rosewood', 'sequoia', 'spruce', 'sycamore',
            'white_cedar', 'willow'
        ]
        woodTypes.each { wood ->
            def f = new File(outputDir, "tfc_leaves_${wood}.json")
            f.text = "{\n  \"blocks\": [\"tfc:wood/leaves/${wood}\"],\n  \"flag\": 1101,\n  \"offset\": 0,\n  \"mid\": \"eclipticseasons:snowy_leaves_top\",\n  \"mid2\": \"eclipticseasons:snowy_leaves_attach\"\n}"
            def ff = new File(outputDir, "tfc_fallen_leaves_${wood}.json")
            ff.text = "{\n  \"blocks\": [\"tfc:wood/fallen_leaves/${wood}\"],\n  \"flag\": 1000,\n  \"offset\": 0,\n  \"mid\": \"estfc:snowy_groundcover\"\n}"
        }

        // ── 植物/农作物 (从 gen_snowy.py 生成的 manifest 读取) ──
        if (manifestFile.exists()) {
            def manifest = new groovy.json.JsonSlurper().parse(manifestFile)

            modelDefDir.mkdirs()
            blockModelDir.mkdirs()

            manifest.each { plant ->
                // 雪定义 → data/estfc/eclipticseasons/snow_definitions/
                def sd = new File(outputDir, "tfc_plant_${plant.plant_key}.json")
                def sdJson = [
                    blocks: plant.block_id,
                    flag: plant.flag,
                    offset: plant.is_leaves ? 0 : 1,
                    mid: "estfc:snowy/tfc_${plant.plant_key}"
                ]
                if (plant.is_leaves) {
                    sdJson.mid = "eclipticseasons:snowy_leaves_top"
                    sdJson.mid2 = "eclipticseasons:snowy_leaves_attach"
                    sdJson.remove('offset')
                }
                sd.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(sdJson))

                // 模型定义 → assets/estfc/eclipticseasons/model_definitions/snowy/
                def md = new File(modelDefDir, "tfc_${plant.plant_key}.json")
                def mdJson = [
                    replace: true,
                    variants: ["" : [model: "estfc:block/snowy/tfc/${plant.best_texture}"]]
                ]
                md.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(mdJson))

                // 方块模型 → assets/estfc/models/block/snowy/tfc/
                def bmFile = new File(blockModelDir, plant.best_texture + '.json')
                def parentPath = bmFile.toPath().toAbsolutePath().getParent()
                java.nio.file.Files.createDirectories(parentPath)
                def bmJson = [
                    parent: "minecraft:block/cross",
                    textures: [cross: "estfc:block/${plant.best_texture}"]
                ]
                java.nio.file.Files.writeString(bmFile.toPath().toAbsolutePath(),
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(bmJson)))
            }
            println "Generated ${manifest.size()} plant snow definitions + model definitions + block models"
        } else {
            println "WARNING: plant_manifest.json not found. Run gen_snowy.py first."
        }
    }
}

// 处理资源时先生成 JSON
processResources.dependsOn generateTfcSnowDefinitions

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
