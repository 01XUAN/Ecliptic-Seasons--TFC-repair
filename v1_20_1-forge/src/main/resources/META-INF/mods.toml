modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
使 Ecliptic Seasons（节气模组）的节气、天气与 TerraFirmaCraft（群峦模组）保持同步。
当 TFC 下雪时，节气模组也会下雪；节气模组的节气从 TFC 的日历派生。
需要同时安装 Ecliptic Seasons 和 TerraFirmaCraft。
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tfc"
    mandatory=true
    versionRange="[3.2,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="eclipticseasons"
    mandatory=true
    versionRange="[0.15.0-rc,)"
    ordering="AFTER"
    side="BOTH"
