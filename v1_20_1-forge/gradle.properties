# 1.20.1 Forge 独立构建。
# ForgeGradle 6 需要 Gradle 8.x（8.14+ 会因 Gradle 内部 API 变更报错），且 Gradle 8.8 的
# Groovy 无法解析 Java 25 的 class 文件，所以这里显式钉住 JDK 17。
org.gradle.java.home=C:/Program Files/Java/jdk-17
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

